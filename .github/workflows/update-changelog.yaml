# Reusable workflow (workflow_call) — consumed by connector repos on tag push.
# Fetches the caller's CHANGELOG via the Contents API (no full checkout),
# generates a scoped app token for jtl-software/changelog-page, downloads the
# extractor PHAR anonymously from the release matching the caller's exact
# pinned commit (public repo, no token needed - see run-extractor.sh for why
# a token would actually make this worse), and opens an auto-merge squash PR
# in changelog-page. Consumers pin `uses:` to an exact commit SHA (see
# "Resolve PHAR release tag for this exact commit" below for why - no
# rolling tags).
name: update-changelog

on:
  workflow_call:
    inputs:
      system-name:
        description: 'System name (maps to changelog-page/storage/systems/<system-name>.json)'
        required: true
        type: string
      changelog-file:
        description: 'Path to the changelog markdown file in the caller repo'
        required: false
        default: 'CHANGELOG.md'
        type: string
    secrets:
      APP_ID:
        description: 'App ID of jtl-changelog-page-writer (passed as a secret because it is stored as an org secret)'
        required: true
      APP_PRIVATE_KEY:
        description: 'Private key of the jtl-changelog-page-writer GitHub App'
        required: true

jobs:
  update-changelog:
    name: Update target repo
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      EXTRACTOR_PATH: _extractor
      EXTRACTOR_REPO: jtl-software/changelog-extractor
      # Target repo name and local checkout path (kept identical by convention).
      CHANGELOG_PAGE: changelog-page
    steps:
      # github.workflow_ref is the CALLER's own triggering ref, not this
      # reusable workflow's resolved ref - job.workflow_ref (the `job`
      # context, not `github`) is the one that actually names the ref this
      # job's own workflow file was pinned to. Using the wrong one here made
      # the next step silently fetch whatever ref the caller happened to be
      # on, from this (unrelated) repo.
      - name: Derive reusable workflow ref
        id: workflow-ref
        env:
          WORKFLOW_REF: ${{ job.workflow_ref }}
        run: |
          set -euo pipefail
          echo "ref=${WORKFLOW_REF#*@}" >> "$GITHUB_OUTPUT"

      # There is no rolling release/tag to fall back on - consumers pin
      # `uses:` to an exact commit SHA, so the PHAR we run has to come from
      # the release built at that exact commit, or the SHA pin is a lie (the
      # workflow code would be pinned but the binary it runs wouldn't be).
      # Looks up which release tag (if any) points at the resolved ref; only
      # a non-SHA ref (a branch, for an ad-hoc/test dispatch run - never a
      # real pinned consumer) falls back to the latest v2.x.y release.
      - name: Resolve PHAR release tag for this exact commit
        id: phar-release
        env:
          GH_TOKEN: ${{ github.token }}
          EXTRACTOR_REPO: ${{ env.EXTRACTOR_REPO }}
          WORKFLOW_REF: ${{ steps.workflow-ref.outputs.ref }}
        run: |
          set -euo pipefail
          TAG=""
          if [[ "${WORKFLOW_REF}" =~ ^[0-9a-f]{40}$ ]]; then
            TAG="$(gh api "repos/${EXTRACTOR_REPO}/tags" | jq -r --arg sha "${WORKFLOW_REF}" \
              '.[] | select(.commit.sha == $sha) | .name' | head -1)"
          fi
          if [ -z "${TAG}" ]; then
            echo "::warning::No release tag points at ref '${WORKFLOW_REF}' - falling back to the latest v2.x.y release. Expected for a branch-ref test/dispatch run, not for a real SHA-pinned consumer."
            TAG="$(gh api "repos/${EXTRACTOR_REPO}/releases" --jq '.[].tag_name' | grep -E '^v2\.[0-9]+\.[0-9]+$' | sort -V | tail -1)"
          fi
          if [ -z "${TAG}" ]; then
            echo "::error::Could not resolve any PHAR release tag (neither an exact match for '${WORKFLOW_REF}' nor a v2.x.y fallback)." >&2
            exit 1
          fi
          echo "Resolved PHAR release tag: ${TAG}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      # Generated first: the token is scoped to changelog-page only, used for
      # its checkout, the PR, and the auto-merge. changelog-extractor is public,
      # so reading it (scripts checkout, PHAR download below) needs no App
      # token. app-id comes from a secret because the org stores it under
      # Secrets (not Variables).
      - name: Generate App token (changelog-page)
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: jtl-software
          repositories: changelog-page

      - name: Checkout own scripts (sparse, at current workflow ref)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: ${{ env.EXTRACTOR_REPO }}
          ref: ${{ steps.workflow-ref.outputs.ref }}
          path: ${{ env.EXTRACTOR_PATH }}
          sparse-checkout: .github/scripts

      - name: Fetch CHANGELOG from caller repo (Contents API, no full checkout)
        env:
          GH_TOKEN: ${{ github.token }}
          # Passed via env (not interpolated into the run script) to avoid
          # code injection (CodeQL actions/code-injection).
          CHANGELOG_FILE: ${{ inputs.changelog-file }}
        run: bash "${EXTRACTOR_PATH}/.github/scripts/fetch-changelog.sh" "$CHANGELOG_FILE" "${RUNNER_TEMP}/CHANGELOG.md"

      - name: Checkout ${{ env.CHANGELOG_PAGE }} (only storage/systems)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: jtl-software/${{ env.CHANGELOG_PAGE }}
          token: ${{ steps.app-token.outputs.token }}
          path: ${{ env.CHANGELOG_PAGE }}
          sparse-checkout: storage/systems

      - name: Setup PHP 8.3
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
        with:
          php-version: '8.3'
          extensions: json
          coverage: none

      # Deliberately no token here - see run-extractor.sh's header comment:
      # a foreign-repo installation token gets rejected by the Releases API
      # even for this public repo, so the download is anonymous on purpose.
      - name: Download PHAR and extract changelog into system context
        env:
          SYSTEM_NAME: ${{ inputs.system-name }}
          EXTRACTOR_REPO: ${{ env.EXTRACTOR_REPO }}
          EXTRACTOR_RELEASE_TAG: ${{ steps.phar-release.outputs.tag }}
        run: bash "${EXTRACTOR_PATH}/.github/scripts/run-extractor.sh" "${SYSTEM_NAME}" "${CHANGELOG_PAGE}" "${RUNNER_TEMP}/CHANGELOG.md"

      - name: Derive PR branch name (sanitize ref)
        id: branch
        env:
          CALLER_REF: ${{ github.ref_name }}
          CALLER_REPO: ${{ github.event.repository.name }}
        run: |
          SAFE_REF="$(echo "${CALLER_REF}" | tr '/' '-' | tr -cd '[:alnum:]._-')"
          echo "name=merge/${CALLER_REPO}-${SAFE_REF}" >> "$GITHUB_OUTPUT"

      - name: Create Pull Request in ${{ env.CHANGELOG_PAGE }}
        id: cpr
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          path: ${{ env.CHANGELOG_PAGE }}
          token: ${{ steps.app-token.outputs.token }}
          branch: ${{ steps.branch.outputs.name }}
          delete-branch: true
          commit-message: "chore(changelog): update ${{ inputs.system-name }} from ${{ github.event.repository.name }}@${{ github.ref_name }}"
          title: "chore(changelog): update ${{ inputs.system-name }} from ${{ github.event.repository.name }}@${{ github.ref_name }}"
          body: |
            Automated changelog update PR.

            - Source: `${{ github.event.repository.name }}` @ `${{ github.ref_name }}`
            - System: `${{ inputs.system-name }}`
            - Workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

      - name: Enable auto-merge (squash) on the PR
        if: steps.cpr.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_REPO: jtl-software/${{ env.CHANGELOG_PAGE }}
          PR_NUMBER: ${{ steps.cpr.outputs.pull-request-number }}
        run: gh pr merge --auto --squash "${PR_NUMBER}"
