# Triggered on v* tag pushes. Builds the PHAR, runs the fixture self-test
# (gates the release — nothing is published if it fails), and creates a
# versioned GitHub Release with the PHAR and SHA256 checksum as assets.
# No rolling tag or rolling Release - consumers pin `uses:` to an exact
# commit SHA, and the reusable workflow resolves the matching versioned
# Release for that same commit at runtime (see update-changelog.yaml).
name: release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-release:
    name: Build PHAR and create Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP 8.3
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
        with:
          php-version: '8.3'
          extensions: json
          tools: composer:v2
          coverage: none

      - name: Install production dependencies
        run: composer install --no-interaction --no-progress --prefer-dist --no-dev

      - name: Build PHAR
        run: php --define phar.readonly=0 buildPhar.php

      - name: Full self-test against fixture
        run: bash .github/scripts/verify-fixture.sh changelog-extractor.phar workspace

      - name: Generate PHAR SHA256 checksum sidecar
        run: |
          sha256sum changelog-extractor.phar > changelog-extractor.phar.sha256
          cat changelog-extractor.phar.sha256

      - name: Create versioned GitHub Release with PHAR asset
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          files: |
            changelog-extractor.phar
            changelog-extractor.phar.sha256
          generate_release_notes: true
          fail_on_unmatched_files: true
