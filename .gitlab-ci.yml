variables:
  FF_USE_FASTZIP: 1
  COMPOSER_CACHE_DIR: ${CI_PROJECT_DIR}/.composer-cache

default:
  image: gitlab.jtl-software.com:4567/connector/connector-utils/ci-docker/php/cli:8.1
  tags:
    - docker
  before_script:
    - composer update --no-interaction --no-progress
  cache:
    key: vendor
    policy: pull
    paths:
      - vendor
      - .composer-cache
      - composer.lock

include:
  - project: 'connector/connector-utils/php-code-quality'
    file: 'ci.yaml'

stages:
  - cache
  - test

build_cache:
  stage: cache
  script:
    - echo
  cache:
    key: vendor
    policy: pull-push
    paths:
      - vendor
      - .composer-cache
      - composer.lock

code_quality:
  before_script: []