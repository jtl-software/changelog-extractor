# Lints all GitHub Actions workflow and action files with actionlint via
# reviewdog. Path-filtered: only runs when .github/workflows/** or
# .github/actions/** files change.
name: Lint GitHub Actions

on:
  push:
    branches: [main, master]
    paths:
      - '.github/workflows/**'
      - '.github/actions/**'
      - '.github/actionlint.yaml'
  pull_request:
    paths:
      - '.github/workflows/**'
      - '.github/actions/**'
      - '.github/actionlint.yaml'

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github

      - uses: reviewdog/action-actionlint@dbe5299849118fd6f099ba563d263d770955a64a # v1.73.2
        with:
          reporter: ${{ github.event_name == 'pull_request' && 'github-pr-review' || 'github-check' }}
          fail_level: error
          # actionlint 1.7.12's `job` context type doesn't know about
          # workflow_ref/workflow_sha yet (real GitHub Actions fields,
          # confirmed working at runtime) - false positive, narrowly ignored.
          actionlint_flags: -ignore 'property "workflow_ref" is not defined'
